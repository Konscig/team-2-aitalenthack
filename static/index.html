<!doctype html>
<html lang="ru"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Переводы за рубеж — демо</title><link rel="stylesheet" href="/static/styles.css" /></head>
<body><main class="phone-shell"><section id="app" aria-live="polite"></section><nav class="bottom-nav" aria-label="Навигация"><button type="button" onclick="go('home')"><span>⌂</span>Главный</button><button type="button" class="active" onclick="go('home')"><span>⇄</span>Платежи</button><button type="button" onclick="go('settings')"><span>⚙</span>Настройки</button></nav></main>
<aside class="push-console" aria-label="Инструмент проверки push-сценариев"><div class="console-kicker">Инструмент прототипа</div><h2>Проверка контекста</h2><p>Push появляется только после сильного frame и пройденного execution gate.</p><form onsubmit="triggerPush(event)"><label for="push-corridor">Страна в пуше</label><select id="push-corridor"><option value="TJS">Таджикистан</option><option value="UZS">Узбекистан</option><option value="KGS">Кыргызстан</option><option value="AMD">Армения</option><option value="KZT">Казахстан</option></select><fieldset class="scenario-picker"><legend>Сценарий</legend><label><input type="radio" name="scenario" value="strong" checked><span><b>Сильный + gate пройден</b><small>Push и hint рядом с актуальным расчётом</small></span></label><label><input type="radio" name="scenario" value="expired"><span><b>Push устарел</b><small>Откроем обычный перевод без hint</small></span></label><label><input type="radio" name="scenario" value="silent"><span><b>Нет подтверждённого frame</b><small>Молчим, обычный путь остаётся</small></span></label></fieldset><label for="push-text">Текст push</label><textarea id="push-text" rows="3" maxlength="240" placeholder="По умолчанию — текст фикстуры"></textarea><button class="primary" type="submit">Запустить сценарий</button><p id="push-result" class="tiny" aria-live="polite"></p></form></aside><script src="/static/app.js"></script></body></html>
